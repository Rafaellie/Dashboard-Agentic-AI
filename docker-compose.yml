version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic_dashboard_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env # Pastikan .env tersedia atau disediakan oleh CI/CD saat deploy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic_dashboard_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_TUNNEL_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
